repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: debug-statements
      - id: check-merge-conflict

  # Ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      # Comprehensive linting aligned with pyproject.toml configuration
      - id: ruff
        name: ruff-lint
        description: Run ruff linter with comprehensive checks
        args: [--fix, --exit-non-zero-on-fix]
        files: ^gal_friday/|^tests/

      # Code formatting
      - id: ruff-format
        name: ruff-format
        description: Run ruff formatter
        files: ^gal_friday/|^tests/

  # Type checking with MyPy (comprehensive environment for financial system)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy-check
        description: Static type checking with MyPy with enhanced dependencies
        args: [--install-types, --non-interactive]
        files: ^gal_friday/
        exclude: ^gal_friday/dal/alembic_env/
        # Enhanced dependencies from requirements-types.txt for comprehensive type checking
        # Generated via: pip-compile requirements-types.in --output-file requirements-types.txt
        additional_dependencies: [
          # Core runtime dependencies (exact versions from working local environment)
          "pydantic==2.11.7",
          "sqlalchemy==2.0.41",
          "pandas==2.3.1",
          "numpy==1.26.4",
          "fastapi==0.115.14",
          "typer==0.16.0",
          "aiohttp==3.12.14",

          # Essential type stubs for error resolution
          "types-PyYAML>=6.0.0",
          "pandas-stubs==2.3.0.250703",
          "typing-extensions>=4.7.0",
          "types-psutil>=7.0.0",
          "types-redis>=4.6.0",
          "types-requests>=2.32.0",
          "types-setuptools>=80.0.0",

          # Optional dependencies for enhanced type checking
          "influxdb-client>=1.36.0",
          "aioboto3>=11.0.0",
          "cryptography>=41.0.0",
          "alembic>=1.10.0",
          "uvicorn>=0.23.0",
          "scikit-learn>=1.3.0",
          "xgboost>=1.7.0",
          "sendgrid>=6.10.0",
          "twilio>=8.5.0",
          "aiofiles>=23.0.0",
          "google-cloud-storage>=2.0.0"
        ]

  # Security scanning with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit-security
        description: Security vulnerability scanner
        args: [-r, gal_friday/, -f, json, --skip, B101,B601]
        files: ^gal_friday/
